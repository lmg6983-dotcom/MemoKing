<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' memoking: data: blob: https: http:; media-src 'self' memoking: blob:">
  <title>바탕화면 메모</title>
  <link rel="stylesheet" href="vendor/prosemirror.css">
  <link rel="stylesheet" href="vendor/plyr.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/note.css">
  <link rel="stylesheet" href="styles/widget.css">
  <script type="module" src="js/widget.js"></script>
</head>
<body data-color="yellow" class="widget">
  <!-- 바탕화면 위젯: 메모 한 장을 읽기 전용으로 (글은 골라 복사할 수 있음). 위 막대를 끌어 옮기고, 가장자리를 끌어 크기를 바꾼다 -->
  <header class="wg-bar">
    <span class="wg-grip" aria-hidden="true"></span>
    <div class="wg-actions">
      <button type="button" id="wg-copy" class="icon-btn wg-btn" title="본문 복사 (제목 줄 빼고)" aria-label="본문 복사"><svg><use href="#i-copy"/></svg></button>
      <button type="button" id="wg-open" class="icon-btn wg-btn" title="메모 열어서 고치기" aria-label="메모 열어서 고치기"><svg><use href="#i-pen"/></svg></button>
      <button type="button" id="wg-remove" class="icon-btn wg-btn" title="바탕화면에서 떼기 (메모는 그대로)" aria-label="바탕화면에서 떼기"><svg><use href="#i-unpin"/></svg></button>
    </div>
  </header>
  <main id="editor" class="editor wg-doc"></main>
  <div id="wg-locked" class="wg-locked" hidden>
    <svg aria-hidden="true"><use href="#i-lock"/></svg>
    <p><b id="wg-locked-title"></b>잠긴 메모라 바탕화면에는 내용이 보이지 않아요</p>
    <button type="button" id="wg-unlock" class="btn">열어서 비밀번호 넣기</button>
  </div>
  <div id="wg-toast" class="wg-toast" role="status" aria-live="polite"></div>
</body>
</html>
