<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>메모킹 — 모두 찾기</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/finder.css" />
  <link rel="stylesheet" href="styles/magic-actions.css" />
</head>
<body>
  <header class="finder-top">
    <input id="finder-input" class="finder-input" type="search" placeholder="메모 · 폴더 · 파일 이름으로 찾기" aria-label="찾을 말"
      aria-controls="finder-list" autocomplete="off" spellcheck="false" autofocus />
    <div id="finder-tabs" class="finder-tabs" role="tablist" aria-label="종류">
      <button type="button" role="tab" data-kind="all" aria-selected="true">모두 <span class="n"></span></button>
      <button type="button" role="tab" data-kind="note" aria-selected="false">메모 <span class="n"></span></button>
      <button type="button" role="tab" data-kind="folder" aria-selected="false">폴더 <span class="n"></span></button>
      <button type="button" role="tab" data-kind="file" aria-selected="false">파일 <span class="n"></span></button>
    </div>
  </header>
  <div class="finder-head" role="row">
    <button type="button" class="col-name" data-sort="name">이름</button>
    <button type="button" class="col-where" data-sort="where">경로</button>
    <button type="button" class="col-size" data-sort="size">크기</button>
    <button type="button" class="col-time" data-sort="time">고친 때</button>
  </div>
  <div id="finder-scroll" class="finder-scroll">
    <div id="finder-list" class="finder-list" role="listbox" aria-label="찾은 것"></div>
    <p id="finder-empty" class="finder-empty" hidden></p>
  </div>
  <footer class="finder-foot">
    <span id="finder-count" class="finder-count"></span>
    <span id="finder-status" class="finder-status"></span>
  </footer>
  <script type="module" src="js/finder.js"></script>
</body>
</html>
