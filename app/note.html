<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' memoking: data: blob: https: http:; media-src 'self' memoking: blob:">
  <title>메모킹</title>
  <link rel="stylesheet" href="vendor/prosemirror.css">
  <link rel="stylesheet" href="vendor/plyr.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/note.css">
  <script type="module" src="js/note.js"></script>
</head>
<body data-color="yellow">
  <!-- 메모 스택: 브라우저 탭처럼 (스택일 때만 보임) -->
  <nav id="stack-tabs" class="stack-tabs" role="tablist" aria-label="스택의 메모" hidden></nav>
  <div id="stack-drop" class="stack-drop" hidden><span>놓으면 탭으로 합쳐요</span></div>
  <header class="bar">
    <button id="new-btn" class="icon-btn" title="새 탭으로 메모 추가 (새 창은 Ctrl+N)" aria-label="새 탭으로 메모 추가"><svg><use href="#i-plus"/></svg></button>
    <span id="status" class="status" role="status"></span>
    <button id="top-btn" class="icon-btn top-btn crown-btn" title="왕관 스티커를 붙여 다른 창보다 늘 위에 두기 (Ctrl+Shift+T, 다시 누르면 떼기)" aria-label="다른 창보다 늘 위에 두기" aria-pressed="false">
      <svg><use href="#i-crown-line"/></svg>
    </button>
    <button id="bell-btn" class="icon-btn count-btn bell-btn" title="일정과 알림 (Ctrl+Shift+A)" aria-label="일정과 알림">
      <svg><use href="#i-bell"/></svg><span id="bell-count" class="count"></span>
    </button>
    <button id="links-btn" class="icon-btn links-btn" title="메모 연결 (Ctrl+K)" aria-label="메모 연결">
      <svg><use href="#i-link"/></svg><span id="links-count" class="count"></span>
    </button>
    <button id="menu-btn" class="icon-btn" title="메뉴" aria-label="메뉴" aria-haspopup="true"><svg><use href="#i-more"/></svg></button>
    <button id="close-btn" class="icon-btn" title="닫기 (Ctrl+W), 자동 저장돼요" aria-label="닫기"><svg><use href="#i-close"/></svg></button>
  </header>

  <div id="menu" class="menu" role="menu" hidden>
    <div class="swatches" id="swatches"></div>
    <button class="menu-item" id="pin-toggle" role="menuitem"><svg><use href="#i-pin"/></svg><span>목록 맨 위에 고정</span></button>
    <button class="menu-item" id="show-list" role="menuitem"><svg><use href="#i-list"/></svg><span>메모 목록 열기</span></button>
    <button class="menu-item" id="join-btn" role="menuitem"><svg><use href="#i-tabs"/></svg><span>다른 메모 창과 합치기…</span></button>
    <button class="menu-item" id="lock-btn" role="menuitem"><svg><use href="#i-lock"/></svg><span>잠그기</span></button>
    <button class="menu-item" id="versions-btn" role="menuitem"><svg><use href="#i-history"/></svg><span>이전 버전</span></button>
    <button class="menu-item" id="shortcuts-btn" role="menuitem"><svg><use href="#i-keys"/></svg><span>단축키 보기 <small>Ctrl+/</small></span></button>
    <button class="menu-item" id="pdf-btn" role="menuitem"><svg><use href="#i-pdf"/></svg><span>PDF로 저장</span></button>
    <button class="menu-item" id="image-copy-btn" role="menuitem"><svg><use href="#i-image"/></svg><span>그림으로 복사</span></button>
    <button class="menu-item" id="image-save-btn" role="menuitem"><svg><use href="#i-photo"/></svg><span>그림으로 저장</span></button>
    <button class="menu-item" id="transcribe-btn" role="menuitem"><svg><use href="#i-mic"/></svg><span>소리 받아쓰기</span></button>
    <button class="menu-item danger" id="delete-btn" role="menuitem"><svg><use href="#i-trash"/></svg><span>삭제</span></button>
  </div>

  <div id="banner" class="banner" hidden>
    <span id="banner-text"></span>
    <button id="banner-load" class="banner-btn primary">바뀐 내용 보기</button>
    <button id="banner-keep" class="banner-btn">지금 내용 두기</button>
  </div>

  <div id="alarm-banner" class="banner alarm-banner" role="alert" hidden>
    <svg><use href="#i-bell"/></svg>
    <span id="alarm-text"></span>
    <button id="alarm-ok" class="banner-btn primary">확인했어요</button>
  </div>

  <!-- 녹음 중: 빨간 점 · 시간 · 소리 크기 · 잠시 멈춤 · 끝내기 (끝내면 소리 파일이 음성 카드로 메모 끝에) -->
  <div id="rec-panel" class="rec-panel desk-rec" role="region" aria-label="녹음" hidden>
    <div class="rec-row">
    <span class="rec-dot" aria-hidden="true"></span>
    <b id="rec-time" class="rec-time">00:00</b>
    <span id="rec-state" class="rec-state">녹음 중</span>
    <span id="rec-wave" class="rec-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="grow"></span>
    <button id="rec-pause" class="rec-btn" title="일시 정지" aria-label="일시 정지"><svg><use href="#i-pause"/></svg></button>
    <button id="rec-stop" class="rec-btn stop" title="녹음 끝내기 (Ctrl+Shift+R)"><svg><use href="#i-stop"/></svg><span>끝내기</span></button>
    </div>
    <div id="rec-text" class="rec-text" aria-live="polite" hidden></div>
  </div>

  <main id="editor" class="editor"></main>

  <!-- 태그 없는 메모: 추천 태그 (누르면 달기) — 휴대폰과 같음 -->
  <div id="tag-suggest-bar" class="tag-suggest-bar" role="group" aria-label="추천 태그" hidden>
    <span class="tsb-label"><svg><use href="#i-tag"/></svg>추천</span>
    <div id="tag-suggest-chips" class="tsb-chips"></div>
    <button id="tag-suggest-close" class="icon-btn" title="닫기" aria-label="추천 태그 닫기"><svg><use href="#i-close"/></svg></button>
  </div>

  <!-- 예약 알림 패널 -->
  <aside id="reminder-panel" class="links-panel reminder-panel" hidden>
    <header class="links-head">
      <b>일정과 알림</b>
      <button id="reminder-close" class="icon-btn" aria-label="일정과 알림 닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <ul id="reminder-list" class="reminder-list"></ul>

    <form id="reminder-form" class="reminder-form rem-flow">
      <!-- 토스처럼 한 번에 하나씩: 무엇을 → 언제 → 미리 알림 → 확인. 답한 단계는 위에 한 줄로 접히고, 누르면 다시 고친다 (reminder-panel.js) -->
      <button type="button" class="btn rem-start" id="rem-start"><svg><use href="#i-plus"/></svg><span>새 일정·알림 만들기</span></button>
      <div class="rem-steps" id="rem-steps" hidden>
        <p class="flow-progress" id="rem-progress" aria-live="polite"></p>
        <ol class="rem-answers" id="rem-answers"></ol>

        <section class="rem-step" data-step="kind">
          <p class="rem-q">무엇을 만들까요?</p>
          <div class="rem-kinds" id="rem-kind" role="radiogroup" aria-label="만들 것">
            <button type="button" data-kind="at" aria-checked="true"><svg><use href="#i-calendar"/></svg><b>일정</b><small>날짜와 시각을 정하고 미리 알려요</small></button>
            <button type="button" data-kind="repeat" aria-checked="false"><svg><use href="#i-repeat"/></svg><b>반복 일정</b><small>매일 · 매주 · 매월 · 매년</small></button>
            <button type="button" data-kind="timer" aria-checked="false"><svg><use href="#i-timer"/></svg><b>타이머</b><small>몇 분 뒤에 알려요</small></button>
            <button type="button" data-kind="startup" aria-checked="false"><svg><use href="#i-power"/></svg><b>앱 열 때</b><small>메모킹을 열면 알려요</small></button>
          </div>
        </section>

        <section class="rem-step" data-step="when" hidden>
          <p class="rem-q" id="rem-when-q">언제예요?</p>
          <div class="rem-pane" data-pane="timer" hidden>
            <div class="chips" id="timer-presets">
              <button type="button" data-min="5">5분</button>
              <button type="button" data-min="10" aria-pressed="true">10분</button>
              <button type="button" data-min="15">15분</button>
              <button type="button" data-min="30">30분</button>
              <button type="button" data-min="60">1시간</button>
              <button type="button" data-min="180">3시간</button>
            </div>
            <label class="rem-row">직접 <input type="number" id="timer-min" min="1" max="10080" value="10"> 분 뒤</label>
          </div>

          <div class="rem-pane" data-pane="at">
            <input type="hidden" id="at-input">
            <label class="rem-row rem-allday-row" id="rem-allday-row"><span>하루 종일</span><input type="checkbox" class="switch" id="rem-allday"></label>
            <div id="at-picker" class="date-picker" aria-label="날짜와 시각"></div>
          </div>

          <div class="rem-pane" data-pane="repeat" hidden>
            <label class="rem-row">
              <select id="rep-every">
                <option value="day">매일</option>
                <option value="week">매주</option>
                <option value="month">매월</option>
                <option value="year">매년</option>
              </select>
              <span id="rep-date" class="rem-inline">
                <span id="rep-month-wrap"><input type="number" id="rep-month" min="1" max="12" value="1"> 월</span>
                <span id="rep-day-wrap"><input type="number" id="rep-day" min="1" max="31" value="1"> 일</span>
              </span>
              <input type="hidden" id="rep-time" value="09:00">
            </label>
            <div class="chips weekdays" id="rep-weekdays" hidden>
              <button type="button" data-wd="1">월</button><button type="button" data-wd="2">화</button><button type="button" data-wd="3">수</button>
              <button type="button" data-wd="4">목</button><button type="button" data-wd="5">금</button><button type="button" data-wd="6">토</button>
              <button type="button" data-wd="0">일</button>
            </div>
            <div id="rep-time-picker" class="date-picker" aria-label="알릴 시각"></div>
          </div>

          <div class="rem-pane" data-pane="startup" hidden>
            <label class="rem-radio"><input type="radio" name="startup" value="every" checked> 열 때마다</label>
            <label class="rem-radio"><input type="radio" name="startup" value="daily"> 하루 한 번 (처음 열 때)</label>
            <label class="rem-radio"><input type="radio" name="startup" value="once"> 다음에 열 때 한 번만</label>
          </div>
        </section>

        <section class="rem-step rem-alerts-wrap" data-step="alerts" id="rem-alerts-wrap" hidden>
          <p class="rem-q" id="rem-alerts-label">언제 미리 알려 드릴까요? <small>여러 개 고를 수 있어요</small></p>
          <div class="chips rem-alerts" id="rem-alerts" role="group" aria-labelledby="rem-alerts-label"></div>
          <p class="rem-hint" id="rem-alerts-hint" role="status"></p>
        </section>

        <section class="rem-step" data-step="finish" hidden>
          <p class="rem-q">이렇게 만들까요?</p>
          <label class="rem-row rem-title-row" id="rem-title-row">이름 <input type="text" id="rem-title" maxlength="80" autocomplete="off" placeholder="비우면 메모 제목"></label>
          <div class="rem-action" role="radiogroup" aria-label="알림 방식">
            <label class="rem-radio"><input type="radio" name="action" value="notify" checked> 알림으로 받기</label>
            <label class="rem-radio"><input type="radio" name="action" value="open"> 메모 바로 열기</label>
          </div>
        </section>
        <!-- 아래 막대: 왼쪽 취소·이전, 오른쪽 다음 → 마지막에 "일정 추가" (토스처럼 늘 같은 자리) -->
        <div class="flow-footer">
          <button type="button" class="btn rem-back" id="rem-back">취소</button>
          <button type="button" class="btn primary rem-submit" id="rem-next">다음</button>
        </div>
      </div>
    </form>
  </aside>

  <aside id="links-panel" class="links-panel" hidden>
    <header class="links-head">
      <b>메모 연결</b>
      <button id="links-close" class="icon-btn" aria-label="메모 연결 닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <input id="link-search" class="link-search" type="search" aria-label="연결할 메모 검색" placeholder="연결할 메모 검색" autocomplete="off">
    <ul id="link-results" class="link-list"></ul>
    <h4>연결한 메모</h4>
    <ul id="links-out" class="link-list"></ul>
    <h4>이 메모를 연결한 메모</h4>
    <ul id="links-in" class="link-list"></ul>
    <h4>비슷한 메모</h4>
    <ul id="links-suggest" class="link-list"></ul>
  </aside>

  <!-- 버전 기록: 자동 저장 전 내용을 10분마다 남겨 두고, 고른 때로 되돌린다 -->
  <aside id="versions-panel" class="links-panel versions-panel" hidden>
    <header class="links-head">
      <b>이전 버전</b>
      <button id="versions-close" class="icon-btn" aria-label="이전 버전 닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <p class="versions-hint">쓰는 동안 10분마다 그때 내용을 남겨 둬요(30일). 되돌려도 지금 내용이 여기에 남아요.</p>
    <ul id="versions-list" class="link-list versions-list"></ul>
  </aside>

  <!-- 서식 도구막대: 창 폭에 들어가지 않는 버튼은 끝의 » 더보기 안으로 옮겨진다 (note.js layoutToolbar) -->
  <!-- 표 안에 커서가 있을 때만: 행 추가 · 열 추가 · 행 지우기 · 열 지우기 · 셀 병합 · 자동 조정 -->
  <div id="table-bar" class="table-bar" role="toolbar" aria-label="표" hidden>
    <button type="button" data-table="addRow" title="아래에 행 추가 (마지막 셀에서 Tab)">행 추가</button>
    <button type="button" data-table="addCol" title="오른쪽에 열 추가">열 추가</button>
    <button type="button" data-table="delRow">행 삭제</button>
    <button type="button" data-table="delCol">열 삭제</button>
    <span class="table-bar-sep"></span>
    <button type="button" data-table="merge" title="끌어서 고른 칸들을 하나로 합치기">셀 병합</button>
    <button type="button" data-table="autoFit" title="내용과 본문 폭에 맞춰 열 너비와 정렬을 자동으로 (번호, 날짜는 좁게, 긴 설명 열에 공간). 칸 오른쪽이나 아래 테두리를 끌면 직접 조절">자동 조정</button>
  </div>
  <footer class="format-bar" id="format-bar" role="toolbar" aria-label="서식">
    <div class="format-items" id="format-items">
      <!-- 콘텐츠 추가: 누르면 위로 음성 녹음 · 손 메모 · 주석 · 사진 · 파일 · 표 · 수식 (휴대폰과 같음) -->
      <button data-action="add" id="add-btn" class="add-btn" title="콘텐츠 추가 (음성 녹음, 손 메모, 글 위에 그리기, 사진, 파일, 표, 수식)" aria-label="콘텐츠 추가" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-plus"/></svg></button>
      <span class="sep"></span>
      <button data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
      <button data-cmd="strike" title="취소선 (Ctrl+T)"><s>S</s></button>
      <span class="sep"></span>
      <button data-action="color" class="swatch-btn" title="글자 색 (Ctrl+Shift+C: 방금 쓴 색)" aria-haspopup="true">
        <span class="glyph">A</span><span class="swatch-bar" data-bar="color"></span>
      </button>
      <button data-action="highlight" class="swatch-btn" title="형광펜 (Ctrl+Shift+H: 방금 쓴 색)" aria-haspopup="true">
        <svg><use href="#i-highlighter"/></svg><span class="swatch-bar" data-bar="highlight"></span>
      </button>
      <span class="sep"></span>
      <button data-action="style" class="style-btn" title="스타일 (본문, 제목, 인용, 코드 블록)" aria-haspopup="listbox" aria-expanded="false"><span class="style-name">본문</span><span class="style-caret" aria-hidden="true"></span></button>
      <span class="sep"></span>
      <button data-cmd="bullet" title="점 목록 (Ctrl+Shift+8)"><svg><use href="#i-bullet"/></svg></button>
      <button data-cmd="ordered" title="번호 목록 (Ctrl+Shift+7)"><svg><use href="#i-ordered"/></svg></button>
      <button data-cmd="task" title="체크리스트 (Ctrl+Shift+9)"><svg><use href="#i-task"/></svg></button>
    </div>
    <button id="more-btn" class="more-btn" title="서식 더보기" aria-label="서식 더보기" aria-haspopup="true" hidden><svg><use href="#i-chevrons"/></svg></button>
  </footer>

  <div id="add-menu" class="add-menu" role="menu" aria-label="콘텐츠 추가" hidden>
    <button class="add-sat" data-add="record" data-action="record" role="menuitem" title="음성 녹음 (Ctrl+Shift+R)"><span class="add-sat-btn rec"><svg><use href="#i-mic"/></svg></span><span class="add-sat-label">음성 녹음</span></button>
    <button class="add-sat" data-add="ink" role="menuitem" title="손 메모 (Ctrl+Shift+D)"><span class="add-sat-btn ink"><svg><use href="#i-ink"/></svg></span><span class="add-sat-label">손 메모</span></button>
    <button class="add-sat" data-add="annotate" role="menuitem" title="글 위에 밑줄이나 동그라미를 그려요 (Ctrl+Shift+E)"><span class="add-sat-btn"><svg><use href="#i-pen"/></svg></span><span class="add-sat-label">글 위에 그리기</span></button>
    <button class="add-sat" data-add="photo" role="menuitem"><span class="add-sat-btn"><svg><use href="#i-photo"/></svg></span><span class="add-sat-label">사진</span></button>
    <button class="add-sat" data-add="file" role="menuitem" title="첨부 (Ctrl+Shift+I)"><span class="add-sat-btn"><svg><use href="#i-clip"/></svg></span><span class="add-sat-label">파일</span></button>
    <button class="add-sat" data-add="table" role="menuitem"><span class="add-sat-btn"><svg><use href="#i-table"/></svg></span><span class="add-sat-label">표</span></button>
    <button class="add-sat" data-add="math" role="menuitem"><span class="add-sat-btn"><svg><use href="#i-sigma"/></svg></span><span class="add-sat-label">수식</span></button>
  </div>
  <div id="more-panel" class="pop more-panel" role="toolbar" aria-label="서식 더보기" hidden></div>
  <!-- 스타일 고르기: 그 스타일 모양 그대로 미리 보임, 지금 줄의 스타일에 표시 -->
  <div id="style-menu" class="pop style-menu" role="listbox" aria-label="스타일" hidden>
    <button type="button" role="option" data-style="paragraph"><span class="style-sample s-paragraph">본문</span><kbd>Ctrl+0</kbd></button>
    <button type="button" role="option" data-style="h1"><span class="style-sample s-h1">제목 1</span><kbd>Ctrl+1</kbd></button>
    <button type="button" role="option" data-style="h2"><span class="style-sample s-h2">제목 2</span><kbd>Ctrl+2</kbd></button>
    <button type="button" role="option" data-style="h3"><span class="style-sample s-h3">제목 3</span><kbd>Ctrl+3</kbd></button>
    <button type="button" role="option" data-style="quote"><span class="style-sample s-quote">인용</span><kbd>Ctrl+Shift+B</kbd></button>
    <button type="button" role="option" data-style="codeBlock"><span class="style-sample s-code">코드 블록</span><kbd></kbd></button>
    <button type="button" role="option" data-style="math" title="LaTeX 수식 (글 가운데는 $x^2$ 처럼 쳐도 돼요)"><span class="style-sample s-math">∑ 수식</span><kbd>$$</kbd></button>
  </div>
  <div id="palette" class="pop palette" role="menu" hidden>
    <div class="palette-title" id="palette-title"></div>
    <div class="palette-swatches" id="palette-swatches"></div>
    <button class="palette-clear" id="palette-clear" type="button">색 지우기</button>
  </div>

  <input id="file-input" type="file" multiple hidden>
  <input id="photo-input" type="file" accept="image/*" multiple hidden>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">취소</button>
        <button value="ok" class="btn danger" id="confirm-ok">삭제</button>
      </div>
    </form>
  </dialog>
</body>
</html>
