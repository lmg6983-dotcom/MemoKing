<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' memoking: blob: data:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; img-src 'self' memoking: data: blob: https: http:; media-src 'self' memoking: blob:">
  <title>메모킹</title>
  <link rel="stylesheet" href="vendor/prosemirror.css">
  <link rel="stylesheet" href="vendor/plyr.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/note.css">
  <link rel="stylesheet" href="styles/ctx-menu.css">
  <script type="module" src="js/note.js"></script>
</head>
<body data-color="yellow">
  <!-- 메모 스택: 브라우저 탭처럼 (스택일 때만 보임) -->
  <nav id="stack-tabs" class="stack-tabs" role="tablist" aria-label="스택의 메모" hidden></nav>
  <div id="stack-drop" class="stack-drop" hidden><span>놓으면 탭으로 합쳐요</span></div>
  <header class="bar">
    <button id="new-btn" class="icon-btn" title="새 탭: 이 창에 메모를 하나 더 쌓아요 (새 창은 Ctrl+N)" aria-label="새 탭으로 메모 추가"><svg><use href="#i-plus"/></svg></button>
    <span id="status" class="status" role="status"></span>
    <span id="mode-tag" class="mode-tag" hidden></span>
    <button id="top-btn" class="icon-btn top-btn crown-btn" title="왕관 스티커를 붙여 다른 창보다 늘 위에 두기 (Ctrl+Shift+T, 다시 누르면 떼기)" aria-label="다른 창보다 늘 위에 두기" aria-pressed="false">
      <svg><use href="#i-crown-line"/></svg>
    </button>
    <!-- 일정 · 알림 · 불러오기 키 · 테이프는 자주 쓰지 않아 ⋯ 메뉴에. 일정 · 알림은 이 메모에 있을 때만 숫자와 함께 윗막대에 -->
    <button id="event-btn" class="icon-btn count-btn event-btn" title="일정" aria-label="일정" data-hide-empty hidden>
      <svg><use href="#i-calendar"/></svg><span id="event-count" class="count"></span>
    </button>
    <button id="bell-btn" class="icon-btn count-btn bell-btn" title="알림 (Ctrl+Shift+A)" aria-label="알림" data-hide-empty hidden>
      <svg><use href="#i-bell"/></svg><span id="bell-count" class="count"></span>
    </button>
    <button id="menu-btn" class="icon-btn" title="메뉴" aria-label="메뉴" aria-haspopup="true"><svg><use href="#i-more"/></svg></button>
    <button id="close-btn" class="icon-btn" title="닫기 (Ctrl+W), 자동 저장돼요" aria-label="닫기"><svg><use href="#i-close"/></svg></button>
  </header>

  <div id="menu" class="menu" role="menu" hidden>
    <!-- 목록 카드 메뉴와 같은 모양: 맨 위 아이콘 줄(같은 아이콘 · 같은 순서 — 글 복사 · 공유 · PDF · 휴지통, content-icons.js 를 note.js 가 넣는다.
         메모 창은 열려 있으니 잘라내기는 없음) → 색 → 글 메뉴(아이콘 없이, 휴대폰처럼) → 아래 작은 줄(그림으로 · 목록 · 단축키) -->
    <!-- 맨 위 한 줄: 카드 메뉴와 같은 아이콘 넷 | 윗막대에서 옮겨 온 알림 · 일정 · 바탕화면 (높이를 늘리지 않게 아이콘으로) -->
    <div class="menu-top">
      <div class="menu-icons" role="group" aria-label="복사, 공유, PDF, 삭제">
        <button class="menu-item menu-ic" id="copy-text-btn" role="menuitem" title="글 복사" aria-label="글 복사"></button>
        <button class="menu-item menu-ic" id="share-btn" role="menuitem" title="공유" aria-label="공유"></button>
        <button class="menu-item menu-ic" id="pdf-btn" role="menuitem" title="PDF로 저장" aria-label="PDF로 저장"></button>
        <button class="menu-item menu-ic danger" id="delete-btn" role="menuitem" title="삭제 (휴지통으로)" aria-label="삭제"></button>
      </div>
      <span class="menu-vsep" aria-hidden="true"></span>
      <div class="menu-quick" role="group" aria-label="알림, 일정, 바탕화면">
        <button class="menu-item menu-ic" id="remind-menu-btn" role="menuitem" title="알림 맞추기 (Ctrl+Shift+A)" aria-label="알림 맞추기"><svg><use href="#i-bell"/></svg></button>
        <button class="menu-item menu-ic" id="event-menu-btn" role="menuitem" title="일정 넣기" aria-label="일정 넣기"><svg><use href="#i-calendar"/></svg></button>
        <button class="menu-item menu-ic" id="tape-btn" role="menuitem" title="테이프로 바탕화면에 붙여 다른 창 뒤에 두기 (Ctrl+Shift+G)" aria-label="바탕화면에 붙이기" hidden><svg><use href="#i-tape"/></svg></button>
      </div>
    </div>
    <div class="menu-colors"><span class="menu-label">색</span><div class="swatches" id="swatches"></div></div>
    <button class="menu-item" id="pin-toggle" role="menuitem"><span>목록 맨 위에 고정</span></button>
    <button class="menu-item" id="day-btn" role="menuitem"><span>회상 날짜 정하기 <small id="day-label"></small></span></button>
    <button class="menu-item" id="mode-btn" role="menuitem"><span>Work로 옮기기</span></button>
    <hr class="menu-sep" role="separator">
    <button class="menu-item" id="hotkey-menu-btn" role="menuitem"><span>불러오기 키 정하기 <small id="hotkey-menu-label"></small></span></button>
    <button class="menu-item" id="links-btn" role="menuitem" hidden><span>메모 연결 <small id="links-count"></small></span></button>
    <button class="menu-item" id="join-btn" role="menuitem"><span>다른 메모 창과 합치기</span></button>
    <hr class="menu-sep" role="separator">
    <button class="menu-item" id="lock-btn" role="menuitem"><span>잠그기</span></button>
    <button class="menu-item" id="versions-btn" role="menuitem"><span>이전 버전</span></button>
    <button class="menu-item" id="find-btn" role="menuitem"><span>찾기, 바꾸기</span></button>
    <div class="menu-foot" role="group" aria-label="그 밖에">
      <button class="menu-item menu-mini" id="image-copy-btn" role="menuitem" title="메모를 보이는 그대로 그림으로 복사">그림으로 복사</button>
      <button class="menu-item menu-mini" id="image-save-btn" role="menuitem" title="메모를 보이는 그대로 그림 파일(PNG)로 저장">그림으로 저장</button>
      <button class="menu-item menu-mini" id="show-list" role="menuitem" title="메모 목록 열기 (Ctrl+Shift+M)">목록</button>
      <button class="menu-item menu-mini" id="shortcuts-btn" role="menuitem" title="단축키 보기 (Ctrl+/)">단축키</button>
    </div>
  </div>

  <div id="banner" class="banner" hidden>
    <span id="banner-text"></span>
    <button id="banner-load" class="banner-btn primary">바뀐 내용 보기</button>
    <button id="banner-keep" class="banner-btn">지금 내용 두기</button>
  </div>

  <div id="alarm-banner" class="banner alarm-banner" role="alert" hidden>
    <svg><use href="#i-bell"/></svg>
    <span id="alarm-text"></span>
    <button id="alarm-ok" class="banner-btn primary">확인했어요</button>
  </div>

  <!-- 녹음 중: 빨간 점 · 시간 · 소리 크기 · 잠시 멈춤 · 끝내기 (끝내면 소리 파일이 음성 카드로 메모 끝에) -->
  <div id="rec-panel" class="rec-panel desk-rec" role="region" aria-label="녹음" hidden>
    <div class="rec-row">
    <span class="rec-dot" aria-hidden="true"></span>
    <b id="rec-time" class="rec-time">00:00</b>
    <span id="rec-state" class="rec-state">녹음 중</span>
    <span id="rec-wave" class="rec-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="grow"></span>
    <button id="rec-pause" class="rec-btn" title="일시 정지" aria-label="일시 정지"><svg><use href="#i-pause"/></svg></button>
    <button id="rec-stop" class="rec-btn stop" title="녹음 끝내기 (Ctrl+Shift+R)"><svg><use href="#i-stop"/></svg><span>끝내기</span></button>
    </div>
    <div id="rec-text" class="rec-text" aria-live="polite" hidden></div>
  </div>

  <main id="editor" class="editor"></main>

  <!-- 태그 없는 메모: 추천 태그 (누르면 달기) — 휴대폰과 같음 -->
  <div id="tag-suggest-bar" class="tag-suggest-bar" role="group" aria-label="추천 태그" hidden>
    <span class="tsb-label"><svg><use href="#i-tag"/></svg>추천</span>
    <div id="tag-suggest-chips" class="tsb-chips"></div>
    <button id="tag-ai-btn" class="link-btn tsb-ai" type="button" hidden>AI로 고르기</button>
    <button id="tag-suggest-close" class="icon-btn" title="닫기" aria-label="추천 태그 닫기"><svg><use href="#i-close"/></svg></button>
  </div>
  <!-- AI 가 뒤에서 한 일 (매직키 다듬기 · 일정 자동 등록) — 알림을 눌러 열면 여기서 되돌린다 -->
  <div id="ai-notice-bar" class="tag-suggest-bar ai-notice-bar" role="status" hidden>
    <span id="ai-notice-text" class="ai-notice-text"></span>
    <button id="ai-notice-undo" class="link-btn" type="button">되돌리기</button>
    <button id="ai-notice-close" class="icon-btn" title="닫기" aria-label="AI 알림 닫기"><svg><use href="#i-close"/></svg></button>
  </div>

  <!-- 예약 알림 모달 배경 딤 -->
  <div id="reminder-backdrop" class="reminder-backdrop" hidden></div>

  <!-- 예약 알림 패널: 사이드 드로어 대신 새 일정처럼 화면 중앙에 팝업되는 모달 창으로 공간 확보 -->
  <!-- 일정(📅) · 알림(🔔) 이 함께 쓰는 자리 — 내용은 reminder-panel.js 가 그린다 -->
  <aside id="reminder-panel" class="dialog reminder-panel reminder-modal" hidden role="dialog" aria-modal="true" aria-labelledby="rem-dialog-title">
    <header class="dialog-head rem-dialog-head">
      <h2 id="rem-dialog-title">알림</h2>
      <button id="reminder-close" class="icon-btn dialog-x" aria-label="닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <ul id="reminder-list" class="reminder-list"></ul>
    <div id="reminder-body" class="reminder-body"></div>
  </aside>

  <aside id="links-panel" class="links-panel" hidden>
    <header class="links-head">
      <b>메모 연결</b>
      <button id="links-close" class="icon-btn" aria-label="메모 연결 닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <input id="link-search" class="link-search" type="search" aria-label="연결할 메모 검색" placeholder="연결할 메모 검색" autocomplete="off">
    <ul id="link-results" class="link-list"></ul>
    <h4>연결한 메모</h4>
    <ul id="links-out" class="link-list"></ul>
    <h4>이 메모를 연결한 메모</h4>
    <ul id="links-in" class="link-list"></ul>
    <h4>비슷한 메모</h4>
    <ul id="links-suggest" class="link-list"></ul>
  </aside>

  <!-- 버전 기록: 자동 저장 전 내용을 10분마다 남겨 두고, 고른 때로 되돌린다 -->
  <aside id="versions-panel" class="links-panel versions-panel" hidden>
    <header class="links-head">
      <b>이전 버전</b>
      <button id="versions-close" class="icon-btn" aria-label="이전 버전 닫기"><svg><use href="#i-close"/></svg></button>
    </header>
    <p class="versions-hint">쓰는 동안 10분마다 그때 내용을 남겨 둬요(30일). 되돌려도 지금 내용이 여기에 남아요.</p>
    <ul id="versions-list" class="link-list versions-list"></ul>
  </aside>

  <!-- 서식 도구막대: 창 폭에 들어가지 않는 버튼은 끝의 » 더보기 안으로 옮겨진다 (note.js layoutToolbar) -->
  <!-- 표 안에 커서가 있을 때만: 행 추가 · 열 추가 · 행 지우기 · 열 지우기 · 셀 병합 · 표 나누기 · 아래 표와 합치기 · 자동 조정 -->
  <!-- 표 막대 (v0.32): 할 일을 묶음(행 · 열 · 칸 · 표 · 바꾸기)으로 — 아이콘 + 짧은 이름, 묶음 이름은 흐리게 -->
  <div id="table-bar" class="table-bar grouped" role="toolbar" aria-label="표" hidden>
    <div class="tb-group" role="group" aria-label="행"><span class="tb-name">행</span>
      <button type="button" data-table="addRow" title="아래에 행 추가 (마지막 칸에서 Tab)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="6" rx="1.2"/><path d="M8 10.5v4M6 12.5h4"/></svg><span class="lbl">추가</span></button>
      <button type="button" data-table="delRow" title="이 행 삭제" class="danger"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="6" rx="1.2"/><path d="M6 12.5h4"/></svg><span class="lbl">삭제</span></button>
    </div>
    <div class="tb-group" role="group" aria-label="열"><span class="tb-name">열</span>
      <button type="button" data-table="addCol" title="오른쪽에 열 추가"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="6" height="12" rx="1.2"/><path d="M12.5 6v4M10.5 8h4"/></svg><span class="lbl">추가</span></button>
      <button type="button" data-table="delCol" title="이 열 삭제" class="danger"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="6" height="12" rx="1.2"/><path d="M10.5 8h4"/></svg><span class="lbl">삭제</span></button>
    </div>
    <div class="tb-group" role="group" aria-label="칸"><span class="tb-name">칸</span>
      <button type="button" data-table="merge" title="끌어서 고른 칸들을 하나로 합치기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.2"/><path d="M5 8h6M9 6l2 2-2 2M7 6 5 8l2 2"/></svg><span class="lbl">병합</span></button>
      <button type="button" data-table="accent" title="첫 행을 머리글처럼 굵게, 바탕색으로 (머리글이 있는 표에만)" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.2"/><path d="M2 6.5h12" /><rect x="2.6" y="3.6" width="10.8" height="2.6" fill="currentColor" stroke="none" opacity=".45"/></svg><span class="lbl">머리글</span></button>
    </div>
    <!-- 덜 쓰는 표 도구(표 · 바꾸기): 넓은 창에선 그대로 한 줄, 좁은 창에선 "⋯" 로 막대 위에 펼침 (휴대폰과 같이) -->
    <div class="tb-more" id="table-more" role="group" aria-label="표 도구 더보기">
    <div class="tb-group" role="group" aria-label="표"><span class="tb-name">표</span>
      <button type="button" data-table="autoFit" title="내용과 본문 폭에 맞춰 열 너비와 정렬을 자동으로 (번호, 날짜는 좁게, 긴 설명 열에 공간). 칸 오른쪽이나 아래 테두리를 끌면 직접 조절"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.2"/><path d="M6.5 3v10M4.5 8H2.8M11.5 8h1.7M3.6 7l-.8 1 .8 1M12.4 7l.8 1-.8 1"/></svg><span class="lbl">맞춤</span></button>
      <button type="button" data-table="splitTable" title="커서가 있는 행부터 아래를 새 표로 (아래 표에도 머리글 행)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="4.5" rx="1"/><rect x="2" y="9.5" width="12" height="4.5" rx="1"/><path d="M1 8h2M5 8h2M9 8h2M13 8h2"/></svg><span class="lbl">나누기</span></button>
      <button type="button" data-table="joinTable" title="바로 아래 표를 이 표에 이어 붙이기 (열 수가 같을 때)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.2"/><path d="M2 8h12M8 5.5v5M6.5 7l1.5-1.5L9.5 7"/></svg><span class="lbl">합치기</span></button>
    </div>
    <div class="tb-group" role="group" aria-label="바꾸기"><span class="tb-name">바꾸기</span>
      <button type="button" data-table="toList" title="표를 점 목록으로 (행마다 한 항목, 칸은 · 로 이어서)"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="4.5" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="11.5" r="1" fill="currentColor" stroke="none"/><path d="M6.5 4.5H14M6.5 8H14M6.5 11.5H14"/></svg><span class="lbl">목록으로</span></button>
      <button type="button" data-table="toTask" title="표를 체크리스트로 (행마다 체크 항목 하나, 칸은 · 로 이어서)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3" width="3" height="3" rx=".7"/><rect x="2.2" y="9.5" width="3" height="3" rx=".7"/><path d="M3 4.6l.6.6L4.7 4M7.5 4.5H14M7.5 11H14"/></svg><span class="lbl">체크리스트로</span></button>
      <button type="button" data-table="toText" title="표를 글 줄로 (행마다 한 줄, 칸은 · 로 이어서)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></svg><span class="lbl">글로</span></button>
    </div>
    </div>
    <button type="button" id="table-more-btn" class="tb-more-btn" aria-expanded="false" aria-controls="table-more" title="표 도구 더보기 (맞춤, 나누기, 합치기, 목록으로, 체크리스트로, 글로)" aria-label="표 도구 더보기"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/></svg></button>
  </div>
  <div class="format-bar" id="format-bar" role="toolbar" aria-label="서식">
    <div class="format-items" id="format-items">
      <!-- 콘텐츠 추가: 누르면 위로 음성 녹음 · 손 메모 · 주석 · 사진 · 파일 · 표 · 수식 (휴대폰과 같음) -->
      <button data-action="add" id="add-btn" class="add-btn" title="콘텐츠 추가 (음성 녹음, 손 메모, 글 위에 그리기, 사진, 파일, 표, 수식)" aria-label="콘텐츠 추가" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-plus"/></svg></button>
      <span class="sep"></span>
      <button data-cmd="bold" title="굵게 (Ctrl+B)" aria-label="굵게" aria-pressed="false"><b>B</b></button>
      <button data-cmd="italic" title="기울임 (Ctrl+I)" aria-label="기울임" aria-pressed="false"><i>I</i></button>
      <button data-cmd="underline" title="밑줄 (Ctrl+U)" aria-label="밑줄" aria-pressed="false"><u>U</u></button>
      <button data-cmd="strike" title="취소선 (Ctrl+T)" aria-label="취소선" aria-pressed="false"><s>S</s></button>
      <span class="sep"></span>
      <button data-action="color" class="swatch-btn" title="글자 색 (Ctrl+Shift+C: 방금 쓴 색)" aria-haspopup="true">
        <span class="glyph">A</span><span class="swatch-bar" data-bar="color"></span>
      </button>
      <button data-action="highlight" class="swatch-btn" title="형광펜 (Ctrl+Shift+H: 방금 쓴 색)" aria-haspopup="true">
        <svg><use href="#i-highlighter"/></svg><span class="swatch-bar" data-bar="highlight"></span>
      </button>
      <span class="sep"></span>
      <button data-action="style" class="style-btn" title="스타일 (본문, 제목, 인용, 코드 블록)" aria-haspopup="listbox" aria-expanded="false"><span class="style-name">본문</span><span class="style-caret" aria-hidden="true"></span></button>
      <span class="sep"></span>
      <button data-cmd="bullet" title="점 목록 (Ctrl+Shift+8)"><svg><use href="#i-bullet"/></svg></button>
      <button data-cmd="ordered" title="번호 목록 (Ctrl+Shift+7)"><svg><use href="#i-ordered"/></svg></button>
      <button data-cmd="task" title="체크리스트 (Ctrl+Shift+9)"><svg><use href="#i-task"/></svg></button>
    </div>
    <button id="more-btn" class="more-btn" title="서식 더보기" aria-label="서식 더보기" aria-haspopup="true" hidden><svg><use href="#i-chevrons"/></svg></button>
    <button id="ai-btn" class="ai-btn" title="AI 글쓰기 (맞춤법, 문체, 초안) — 글을 고르면 그 부분만" aria-label="AI 글쓰기" aria-haspopup="dialog" aria-expanded="false" aria-controls="ai-pop" hidden>✦</button>
  </div>

  <div id="add-menu" class="add-menu" role="menu" aria-label="콘텐츠 추가" hidden>
    <button class="add-sat" data-add="record" data-action="record" role="menuitem" title="음성 녹음 (Ctrl+Shift+R)"><span class="add-sat-btn rec"><svg><use href="#i-mic"/></svg></span><span class="add-sat-label">음성 녹음</span></button>
    <button class="add-sat" data-add="ink" role="menuitem" title="손 메모 (Ctrl+Shift+D)"><span class="add-sat-btn ink"><svg><use href="#i-ink"/></svg></span><span class="add-sat-label">손 메모</span></button>
    <button class="add-sat" data-add="annotate" role="menuitem" title="글 위에 밑줄이나 동그라미를 그려요 (Ctrl+Shift+E)"><span class="add-sat-btn"><svg><use href="#i-pen"/></svg></span><span class="add-sat-label">글 위에 그리기</span></button>
    <button class="add-sat" data-add="photo" role="menuitem"><span class="add-sat-btn"><svg><use href="#i-photo"/></svg></span><span class="add-sat-label">사진</span></button>
    <button class="add-sat" data-add="file" role="menuitem" title="첨부 (Ctrl+Shift+I)"><span class="add-sat-btn"><svg><use href="#i-clip"/></svg></span><span class="add-sat-label">파일</span></button>
    <button class="add-sat" data-add="table" role="menuitem"><span class="add-sat-btn"><svg><use href="#i-table"/></svg></span><span class="add-sat-label">표</span></button>
    <button class="add-sat" data-add="math" role="menuitem"><span class="add-sat-btn"><svg><use href="#i-sigma"/></svg></span><span class="add-sat-label">수식</span></button>
  </div>
  <div id="more-panel" class="pop more-panel" role="toolbar" aria-label="서식 더보기" hidden></div>
  <!-- AI 글쓰기 (서식 막대 ✦): 부탁 한 줄 + 빠른 작업 칩 — 이 PC 안의 모델로 (ai-write-panel.js) -->
  <div id="ai-pop" class="pop ai-pop" role="dialog" aria-label="AI 글쓰기" hidden>
    <form class="ai-ask-row">
      <input class="ai-request" type="text" autocomplete="off" aria-label="AI에게 부탁" placeholder="무엇을 쓸까요? Enter로 초안 (비우면 제목을 보고 써요)">
    </form>
    <div class="ai-chips" role="group" aria-label="고른 글, 고르지 않으면 메모 전체에">
      <button type="button" class="ai-chip ai-task ai-spell">맞춤법</button>
    </div>
    <p class="ai-state" role="status" aria-live="polite"></p>
    <button type="button" class="link-btn ai-stop" hidden>멈추기</button>
    <div class="ai-result"></div>
  </div>
  <!-- 스타일 고르기: 그 스타일 모양 그대로 미리 보임, 지금 줄의 스타일에 표시 -->
  <div id="style-menu" class="pop style-menu" role="listbox" aria-label="스타일" hidden>
    <button type="button" role="option" data-style="paragraph"><span class="style-sample s-paragraph">본문</span><kbd>Ctrl+0</kbd></button>
    <button type="button" role="option" data-style="h1"><span class="style-sample s-h1">제목 1</span><kbd>Ctrl+1</kbd></button>
    <button type="button" role="option" data-style="h2"><span class="style-sample s-h2">제목 2</span><kbd>Ctrl+2</kbd></button>
    <button type="button" role="option" data-style="h3"><span class="style-sample s-h3">제목 3</span><kbd>Ctrl+3</kbd></button>
    <button type="button" role="option" data-style="quote"><span class="style-sample s-quote">인용</span><kbd>Ctrl+Shift+B</kbd></button>
    <button type="button" role="option" data-style="codeBlock"><span class="style-sample s-code">코드 블록</span><kbd></kbd></button>
    <button type="button" role="option" data-style="math" title="LaTeX 수식 (글 가운데는 $x^2$ 처럼 쳐도 돼요)"><span class="style-sample s-math">∑ 수식</span><kbd>$$</kbd></button>
  </div>
  <div id="palette" class="pop palette" role="menu" hidden>
    <div class="palette-title" id="palette-title"></div>
    <div class="palette-swatches" id="palette-swatches"></div>
    <button class="palette-clear" id="palette-clear" type="button">색 지우기</button>
  </div>

  <input id="file-input" type="file" multiple hidden>
  <input id="photo-input" type="file" accept="image/*" multiple hidden>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">취소</button>
        <button value="ok" class="btn danger" id="confirm-ok">삭제</button>
      </div>
    </form>
  </dialog>
</body>
</html>
