<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>매직키</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/magic.css" />
</head>
<body>
  <div id="magic" class="magic">
    <!-- 이 막대(와 창 테두리)를 끌면 창이 옮겨진다. 옮긴 자리는 기억 -->
    <div class="magic-grip" title="끌어서 옮기기"><span></span></div>
    <div class="magic-top">
      <span class="magic-icon" aria-hidden="true">✦</span>
      <textarea id="magic-input" class="magic-input" rows="1" placeholder="메모를 쓰거나 메모·파일을 찾아요" aria-label="매직키 입력" autofocus></textarea>
    </div>
    <ul id="magic-results" class="magic-results" role="listbox" aria-label="결과"></ul>
    <div class="magic-foot">
      <div id="magic-modules" class="magic-modules"></div>
      <div id="magic-hint" class="magic-hint"></div>
    </div>
  </div>
  <script type="module" src="js/magic.js"></script>
</body>
</html>
