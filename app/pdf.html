<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' memoking: data:; frame-src 'self'">
  <title>PDF로 저장</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/pdf.css">
  <script type="module" src="js/pdf.js"></script>
</head>
<body>
  <!-- 메모를 PDF 로: 왼쪽 미리보기(실제 쪽 모양), 오른쪽 고르기 -->
  <section class="preview-pane" aria-label="미리보기">
    <div id="stage" class="stage">
      <div id="sheet" class="sheet"><iframe id="frame" title="첫 쪽 미리보기" tabindex="-1"></iframe></div>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
  </section>

  <form id="form" class="options">
    <h1 id="heading">PDF로 저장</h1>

    <p class="label">크기</p>
    <div class="seg" role="radiogroup" aria-label="크기 고르는 방법" id="kind">
      <button type="button" data-kind="paper" aria-checked="true">종이</button>
      <button type="button" data-kind="ratio" aria-checked="false">카드 비율</button>
      <button type="button" data-kind="custom" aria-checked="false">직접 입력</button>
    </div>

    <div class="panel" data-panel="paper">
      <div class="chips" id="papers" role="radiogroup" aria-label="종이"></div>
      <div class="seg small" role="radiogroup" aria-label="방향" id="orientation">
        <button type="button" data-o="portrait" aria-checked="true"><span class="o-icon portrait"></span>세로</button>
        <button type="button" data-o="landscape" aria-checked="false"><span class="o-icon landscape"></span>가로</button>
      </div>
    </div>

    <div class="panel" data-panel="ratio" hidden>
      <div class="chips" id="ratios" role="radiogroup" aria-label="비율"></div>
      <label class="slider-row">
        <span>긴 변</span>
        <input type="range" id="long" min="80" max="300" step="5" value="150">
        <output id="long-out">150mm</output>
      </label>
    </div>

    <div class="panel" data-panel="custom" hidden>
      <div class="size-row">
        <label>가로 <input type="number" id="cw" min="50" max="1200" step="1" value="100"> mm</label>
        <span class="times">×</span>
        <label>세로 <input type="number" id="ch" min="50" max="1200" step="1" value="150"> mm</label>
      </div>
      <label class="check-row"><input type="checkbox" id="lock" checked> 비율 유지</label>
    </div>

    <p class="label">여백</p>
    <div class="seg" role="radiogroup" aria-label="여백" id="margin">
      <button type="button" data-m="none" aria-checked="false">없음</button>
      <button type="button" data-m="narrow" aria-checked="false">좁게</button>
      <button type="button" data-m="normal" aria-checked="true">보통</button>
      <button type="button" data-m="wide" aria-checked="false">넓게</button>
    </div>

    <label class="setting-row"><input type="checkbox" id="bg" class="switch"><span>메모 색 바탕</span></label>
    <label class="setting-row"><input type="checkbox" id="date" class="switch" checked><span>날짜 표시</span></label>

    <div class="actions">
      <label class="check-row open-row"><input type="checkbox" id="open-after" checked> 저장한 뒤 열기</label>
      <span class="grow"></span>
      <button type="button" id="cancel" class="btn">취소</button>
      <button type="submit" id="save" class="btn primary">PDF로 저장</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </form>
</body>
</html>
