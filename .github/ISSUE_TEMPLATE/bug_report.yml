name: 🐞 버그 제보
description: 메모킹이 생각대로 움직이지 않을 때
title: "[버그] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 알려 주셔서 고마워요! 아래를 채워 주시면 빨리 고칠 수 있어요.
  - type: dropdown
    id: platform
    attributes:
      label: 어디에서
      options: [Windows PC, 안드로이드 휴대폰, 둘 다]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 모르면 설치한 날짜를 적어 주셔도 돼요.
      placeholder: v0.76.1 (휴대폰 0.54.1)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 기대한 것과 실제로 일어난 것을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 순서
      placeholder: |
        1. 매직키(Ctrl+Alt+Space)를 열고
        2. "회의"를 입력하면
        3. …
  - type: textarea
    id: extra
    attributes:
      label: 화면 사진 · 오류 기록
      description: 사진을 끌어다 놓을 수 있어요. 메모 내용 같은 개인 정보는 가려 주세요.
