# PC 정식 배포 — v*.*.* 태그를 올리면 Windows 설치 파일을 빌드해 이 저장소의 Release 에 올린다.
#   올라가는 것: MemoKing-Setup-<버전>.exe · .blockmap · latest.yml (자동 업데이트용) + MemoKing-Setup.exe (늘 같은 이름의 최신 링크)
#   공개 저장소라 앱은 토큰 없이 Release 를 읽고, 올리기는 이 저장소의 기본 토큰(github.token)으로 한다.
#   최신 설치 파일: https://github.com/lmg6983-dotcom/MemoKing/releases/latest/download/MemoKing-Setup.exe
name: Release (PC)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Actions 탭 › Run workflow — main 을 고르면 package.json 버전으로 (v<버전> 태그 · Release 는 electron-builder 가 만든다)
    inputs:
      allow_no_google:
        description: 'Google 연결 정보 비밀값 없이도 배포 (사용자가 설정에서 OAuth 클라이언트를 붙여 넣어야 함)'
        type: boolean
        default: false

permissions:
  contents: write # Release 만들기 · 파일 올리기

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 캐시 — 저장소에 package-lock.json 이 없어(개발은 npx 로) setup-node 의 cache: npm 대신 직접 둔다
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\npm-cache
            ~\AppData\Local\memoking-build\node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/build-dist.mjs', 'package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 태그와 package.json 버전이 같은지 (손으로 돌리면 package.json 버전 그대로)
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$version" ]; then
            echo "::error::태그 v$tag 와 package.json 버전 $version 이 달라요. package.json 을 고치고 태그를 다시 올려 주세요"
            exit 1
          fi
          echo "버전 $version"

      - name: 단위 테스트
        run: npm test

      # 구글 로그인 연결 정보(데스크톱 앱 유형 OAuth 클라이언트)를 설치 파일에 넣는다.
      #   없으면 설정 › Google Drive 동기화 가 "연결 안 됨" 이 되고 클라이언트 ID 를 붙여 넣어야 해서 (v0.39.0~0.39.7 이 그랬다)
      #   비밀값이 없으면 멈춘다 — 그래도 배포하려면 Run workflow 의 allow_no_google 을 켠다
      - name: Google 연결 정보 넣기
        shell: bash
        env:
          MEMOKING_GOOGLE_CLIENT_ID: ${{ secrets.MEMOKING_GOOGLE_CLIENT_ID }}
          MEMOKING_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOKING_GOOGLE_CLIENT_SECRET }}
          ALLOW_NO_GOOGLE: ${{ inputs.allow_no_google }}
        run: |
          if [ -n "$MEMOKING_GOOGLE_CLIENT_ID" ]; then
            if [ -z "$MEMOKING_GOOGLE_CLIENT_SECRET" ]; then
              echo "::warning::MEMOKING_GOOGLE_CLIENT_SECRET 이 비어 있어요. 데스크톱 앱 유형 클라이언트는 보안 비밀번호(GOCSPX-…)도 있어야 로그인돼요"
            fi
            node -e 'require("fs").writeFileSync("desktop/google-client.json", JSON.stringify({ id: process.env.MEMOKING_GOOGLE_CLIENT_ID.trim(), secret: (process.env.MEMOKING_GOOGLE_CLIENT_SECRET || "").trim() }))'
            echo "연결 정보를 넣었어요"
          elif [ "$ALLOW_NO_GOOGLE" = "true" ]; then
            echo "::warning::Google 연결 정보 없이 배포해요 — 새로 설치한 사람은 설정에서 OAuth 클라이언트를 붙여 넣어야 해요 (이미 로그인한 PC 는 기억해 둔 클라이언트로 계속)"
          else
            echo "::error::Secrets 에 MEMOKING_GOOGLE_CLIENT_ID · MEMOKING_GOOGLE_CLIENT_SECRET 이 없어요. 없이 배포하면 Google Drive 동기화가 '연결 안 됨' 이 돼요 (README 의 '처음 한 번 준비' 3번). 그래도 배포하려면 Run workflow 에서 allow_no_google 을 켜 주세요"
            exit 1
          fi

      # electron-builder 가 Release v<버전> 을 만들고 설치 파일 · .blockmap · latest.yml 을 올린다
      - name: 빌드 + Release 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-dist.mjs --no-smoke --publish always

      # 늘 같은 이름의 최신 링크 (releases/latest/download/MemoKing-Setup.exe) — 처음 설치하는 사람용
      - name: 최신 설치 파일 링크
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cp "dist/MemoKing-Setup-${version}.exe" MemoKing-Setup.exe
          gh release upload "v${version}" MemoKing-Setup.exe --repo "$RELEASES_REPO" --clobber
          echo "https://github.com/${RELEASES_REPO}/releases/latest/download/MemoKing-Setup.exe"

      # 옛 배포 저장소(memoking-releases)를 보는 옛 앱도 이 버전으로 넘어오게 같은 파일을 그쪽에도 — 새 버전부터는 이 저장소를 본다
      #   shortcut: Secrets 에 MEMOKING_RELEASES_TOKEN 이 있을 때만. 옛 앱이 다 업데이트되면 그 저장소 · 비밀값을 지우면 저절로 건너뜀
      - name: 옛 배포 저장소에도 올리기 (옮기는 동안만)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MEMOKING_RELEASES_TOKEN }}
          OWN_TOKEN: ${{ github.token }}
          LEGACY_REPO: lmg6983-dotcom/memoking-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "옛 배포 저장소 비밀값이 없어 건너뛰어요"; exit 0; fi
          version=$(node -p "require('./package.json').version")
          GH_TOKEN="$OWN_TOKEN" gh release view "v${version}" --repo "$RELEASES_REPO" --json body -q .body > notes.txt
          gh release view "v${version}" --repo "$LEGACY_REPO" >/dev/null 2>&1 || gh release create "v${version}" --repo "$LEGACY_REPO" --title "v${version}" --notes-file notes.txt --latest
          gh release upload "v${version}" "dist/MemoKing-Setup-${version}.exe" "dist/MemoKing-Setup-${version}.exe.blockmap" dist/latest.yml MemoKing-Setup.exe --repo "$LEGACY_REPO" --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: memoking-desktop-${{ github.ref_name }}
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
