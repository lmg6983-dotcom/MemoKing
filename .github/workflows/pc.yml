# PC 점검 — PR · main 에 올릴 때마다 단위 테스트와 실제 Electron 자동 점검(스모크)을 돌린다.
#   v0.64.0 ~ v0.68.0 은 목록 창이 켤 때 멈췄는데(preload 이벤트 등록 빠짐) 스모크를 한 번만 돌렸어도 잡혔다.
#   Linux(가상 화면): 단위 테스트 · 기본 · 튜토리얼 · 바뀐 기능 점검
#   Windows: 기본 점검 + Windows 에서만 되는 클립보드 점검(PowerShell · 그림 복사)
name: PC 점검

on:
  push:
    branches: [main]
    paths: ['app/**', 'desktop/**', 'tests/**', 'scripts/**', 'package.json', 'README.md', '.github/workflows/pc.yml']
  pull_request:
    paths: ['app/**', 'desktop/**', 'tests/**', 'scripts/**', 'package.json', 'README.md', '.github/workflows/pc.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON: electron@44.4.5 # scripts/electron.mjs 와 같게

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 단위 테스트
        run: npm test
      - name: Electron 받기
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          npx -y $ELECTRON --version
      - name: 기본 점검
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx -y $ELECTRON --no-sandbox --disable-gpu . --smoke
      - name: 튜토리얼 점검
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx -y $ELECTRON --no-sandbox --disable-gpu . --smoke --tutorial
      - name: 바뀐 기능 점검
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx -y $ELECTRON --no-sandbox --disable-gpu . --smoke --new

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Electron 받기
        run: npx -y $env:ELECTRON --version
      - name: 기본 점검
        run: npx -y $env:ELECTRON . --smoke
      - name: 클립보드 점검 (Windows 전용 — PowerShell · 그림 복사)
        run: npx -y $env:ELECTRON . --smoke --clipboard
