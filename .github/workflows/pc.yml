# 화면 · 공용 JS 단위 테스트 (PC Rust 판과 휴대폰이 함께 쓰는 app/ · android/web/ · scripts/)
#   PC 앱 자체 점검은 desktop-rs.yml (Rust · 앱 안 --smoke), 설치 파일 갈아타기는 installer-rs.yml
name: 화면 단위 테스트

on:
  push:
    branches: [main]
    paths: ['app/**', 'android/web/**', 'tests/**', 'scripts/**', 'package.json', 'README.md', 'desktop-rs/app/preload.cjs', '.github/workflows/pc.yml']
  pull_request:
    paths: ['app/**', 'android/web/**', 'tests/**', 'scripts/**', 'package.json', 'README.md', 'desktop-rs/app/preload.cjs', '.github/workflows/pc.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 단위 테스트
        run: npm test
