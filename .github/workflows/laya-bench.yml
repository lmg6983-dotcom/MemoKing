# AI 태그 시험 — 앱이 받는 바로 그 모델 파일(core/model-catalog.js 에 고정한 laya-model.yml 실행의 Artifacts)로
#   한국어 태그 시험(scripts/laya-bench.mjs)만 돌린다. 모델을 다시 만들지 않아 몇 분이면 끝나고, 만들 때마다 조금 다른
#   8비트 결과에 숫자가 흔들리지 않는다
name: Laya 태그 시험

on:
  push:
    paths:
      - '.github/workflows/laya-bench.yml'
      - 'scripts/laya-bench.mjs'
      - 'scripts/laya-bench/**'
      - 'app/js/core/laya-*.js'
      - 'app/js/core/tag-suggest.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # 다른 실행의 Artifacts 받기

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: laya-ko-int8
          path: model
          run-id: '40064852464' # core/model-catalog.js 의 파일
          github-token: ${{ github.token }}
      - run: npm install --no-save --no-audit --no-fund onnxruntime-node@1.30.0
      - name: 한국어 태그 시험
        run: node scripts/laya-bench.mjs model
