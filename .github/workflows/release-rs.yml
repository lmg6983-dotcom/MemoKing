# PC Rust 판 베타 배포 (desktop-rs/). Actions 탭 › Run workflow 로만 돈다.
#   올라가는 곳: 이 저장소의 사전 배포 `desktop-rs` (안드로이드의 `android` 와 같은 방식, 정식 Release 와 따로)
#   올라가는 것: MemoKing-Rust-Setup-<버전>.exe, MemoKing-Rust-Setup.exe (늘 같은 이름), latest-tauri.json (자동 업데이트)
#   설치 파일에 함께 넣는 것: AI 엔진 llama-server (npm run llama), MCP 서버 memoking-mcp.exe
#   버전은 desktop-rs/app/tauri.conf.json 의 version. 올려야 자동 업데이트가 새 버전으로 알아본다
#   처음 한 번 준비: guides/RELEASE.md 의 "PC Rust 판 베타"
name: Release (PC Rust 베타)

on:
  workflow_dispatch:

permissions:
  contents: write # 사전 배포 만들기, 파일 올리기

concurrency:
  group: release-rs
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs

      - name: AI 엔진 받기 (desktop/vendor/llama)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/get-llama.mjs

      # Tauri 는 함께 넣을 실행 파일 이름 끝에 대상(target triple)이 붙어 있기를 바란다. 설치하면 MemoKing 옆에 memoking-mcp.exe 로 놓인다
      - name: MCP 서버 빌드
        working-directory: desktop-rs
        run: |
          cargo build --release -p memoking-mcp
          mkdir -p app/binaries
          cp target/release/memoking-mcp.exe app/binaries/memoking-mcp-x86_64-pc-windows-msvc.exe

      # 배포판에만 쓰는 설정: 이름(Electron 판과 바로가기, 설치 폴더가 겹치지 않게), 함께 넣을 파일, 업데이트 주소, 서명 공개 열쇠
      #   서명 열쇠(비밀값)가 없으면 업데이트 파일 없이 설치 파일만 만든다
      - name: 배포 설정 만들기
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ] || [ -z "$PUBKEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY(비밀값) 이나 TAURI_UPDATER_PUBKEY(변수) 가 없어 자동 업데이트 없이 설치 파일만 만들어요 (guides/RELEASE.md)"
          fi
          node -e '
            const signed = process.env.HAS_SIGNING_KEY === "true" && Boolean(process.env.PUBKEY);
            const conf = {
              productName: "MemoKing Beta",
              bundle: {
                resources: { "../../desktop/vendor/llama/": "llama/" },
                externalBin: ["binaries/memoking-mcp"],
                createUpdaterArtifacts: signed,
              },
              plugins: { updater: { pubkey: process.env.PUBKEY || "", endpoints: ["https://github.com/lmg6983-dotcom/MemoKing/releases/download/desktop-rs/latest-tauri.json"] } },
            };
            require("fs").writeFileSync("desktop-rs/app/tauri.release.json", JSON.stringify(conf, null, 2));
          '
          cat desktop-rs/app/tauri.release.json

      # Google 연결 정보는 빌드할 때 실행 파일에 들어간다 (drive.rs option_env!). 없으면 설정에서 OAuth 클라이언트를 붙여 넣어야 한다
      - name: 빌드
        working-directory: desktop-rs/app
        env:
          MEMOKING_GOOGLE_CLIENT_ID: ${{ secrets.MEMOKING_GOOGLE_CLIENT_ID }}
          MEMOKING_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOKING_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$MEMOKING_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::Google 연결 정보 비밀값이 없어요. 새로 설치한 사람은 설정에서 OAuth 클라이언트를 붙여 넣어야 Drive 동기화를 써요"
          fi
          npx --yes @tauri-apps/cli@2.12.5 build --config tauri.release.json

      - name: 사전 배포 desktop-rs 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop-rs/app/tauri.conf.json').version")
          dir=desktop-rs/target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe | head -1)
          cp "$exe" "MemoKing-Rust-Setup-${version}.exe"
          cp "$exe" MemoKing-Rust-Setup.exe
          files=("MemoKing-Rust-Setup-${version}.exe" MemoKing-Rust-Setup.exe)
          if [ -f "$exe.sig" ]; then
            node -e '
              const [version, sig] = process.argv.slice(1);
              const url = `https://github.com/lmg6983-dotcom/MemoKing/releases/download/desktop-rs/MemoKing-Rust-Setup-${version}.exe`;
              const feed = { version, notes: `메모킹 PC Rust 베타 ${version}`, pub_date: new Date().toISOString(), platforms: { "windows-x86_64": { signature: require("fs").readFileSync(sig, "utf8").trim(), url } } };
              require("fs").writeFileSync("latest-tauri.json", JSON.stringify(feed, null, 2));
            ' "$version" "$exe.sig"
            files+=(latest-tauri.json)
          fi
          notes="메모킹 PC 를 Rust + Tauri 로 다시 만든 베타 ${version} 이에요. 같은 메모 폴더, 설정을 쓰니 시험할 때는 Electron 판 메모킹을 끄고 켜 주세요 (둘 다 켜면 알림이 두 번 울려요)."
          if gh release view desktop-rs >/dev/null 2>&1; then
            gh release edit desktop-rs --notes "$notes"
          else
            gh release create desktop-rs --prerelease --target "$GITHUB_SHA" --title "메모킹 PC Rust 베타" --notes "$notes"
          fi
          gh release upload desktop-rs "${files[@]}" --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-rs/MemoKing-Rust-Setup.exe"
