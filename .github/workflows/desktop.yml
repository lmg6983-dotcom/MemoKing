# PC 설치 파일(Windows) 만들기 — 데스크탑(desktop/)이나 공용 웹 코어(app/)가 바뀌면 자동으로 빌드하고,
# 만든 설치 파일을 GitHub 릴리스 "desktop" 에 늘 최신으로 올린다. Actions 탭에서 손으로도 돌릴 수 있다.
#   https://github.com/<저장소>/releases/download/desktop/MemoKing-Setup.exe
name: Desktop Setup

on:
  push:
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'assets/**'
      - 'scripts/build-dist.mjs'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write # 릴리스에 설치 파일 올리기

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 단위 테스트
        run: npm test

      # 구글 로그인 연결 정보(데스크톱 앱 유형 OAuth 클라이언트)를 설치 파일에 넣어, 사용자가 붙여 넣지 않고 바로 로그인하게
      # (저장소 Settings › Secrets 의 MEMOKING_GOOGLE_CLIENT_ID · MEMOKING_GOOGLE_CLIENT_SECRET — 휴대폰 APK 와 같은 값)
      - name: Google 연결 정보 넣기
        shell: bash
        env:
          MEMOKING_GOOGLE_CLIENT_ID: ${{ secrets.MEMOKING_GOOGLE_CLIENT_ID }}
          MEMOKING_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOKING_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$MEMOKING_GOOGLE_CLIENT_ID" ]; then
            node -e 'require("fs").writeFileSync("desktop/google-client.json", JSON.stringify({ id: process.env.MEMOKING_GOOGLE_CLIENT_ID, secret: process.env.MEMOKING_GOOGLE_CLIENT_SECRET || "" }))'
            echo "연결 정보를 넣었어요"
          else
            echo "연결 정보 비밀값이 없어 사용자가 처음 한 번 붙여 넣어요"
          fi

      - name: 설치 파일 빌드 (npm run dist — 자동 점검은 화면이 없는 빌드 서버라 건너뜀)
        run: node scripts/build-dist.mjs --no-smoke

      # 빌드 결과물 보관함은 저장 공간 한도가 있어 짧게 두고, 가득 차도 릴리스(다운로드 링크)는 올라가게
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: memoking-desktop
          retention-days: 3
          path: dist/*.exe
          if-no-files-found: error

      - name: 최신 설치 파일을 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cp "dist/MemoKing-Setup-${version}.exe" MemoKing-Setup.exe
          notes="메모킹 PC 최신 설치 파일 v${version} (${GITHUB_REF_NAME} · ${GITHUB_SHA::7}). MemoKing-Setup.exe 를 받아 실행하세요."
          if gh release view desktop >/dev/null 2>&1; then
            gh release upload desktop MemoKing-Setup.exe --clobber
            gh release edit desktop --notes "$notes"
          else
            gh release create desktop MemoKing-Setup.exe --title "메모킹 PC (최신)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
