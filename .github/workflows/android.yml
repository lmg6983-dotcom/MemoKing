# 안드로이드 APK 만들기 — android/ 나 공용 웹 코어(app/)가 바뀌면 자동으로 빌드하고,
# 만든 APK 를 실행 결과(Artifacts)의 "memoking-android" 로 올린다. Actions 탭에서 손으로도 돌릴 수 있다.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # 릴리스에 APK 올리기

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 동기화 엔진 테스트 + APK 빌드 (디버그 서명 — 휴대폰에 바로 설치 가능)
        # 저장소 설정 › Secrets 에 넣어 두면 Google Drive 로그인 설정이 APK 에 들어간다 (android/DRIVE-SETUP.md)
        env:
          MEMOKING_GOOGLE_CLIENT_ID: ${{ secrets.MEMOKING_GOOGLE_CLIENT_ID }}
          MEMOKING_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOKING_GOOGLE_CLIENT_SECRET }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # 빌드 결과물 보관함은 저장 공간 한도가 있어 짧게 두고, 가득 차도 릴리스(다운로드 링크)는 올라가게
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: memoking-android
          retention-days: 3
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 휴대폰에서 바로 받을 수 있게 GitHub 릴리스 "android" 에 늘 최신 APK 를 올린다
      #   https://github.com/<저장소>/releases/download/android/MemoKing-android.apk
      - name: 최신 APK 를 릴리스에 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MemoKing-android.apk
          notes="메모킹 안드로이드 최신 빌드 (${GITHUB_REF_NAME} · ${GITHUB_SHA::7}). 휴대폰에서 MemoKing-android.apk 를 눌러 설치하세요."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android MemoKing-android.apk --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android MemoKing-android.apk --title "메모킹 안드로이드 (최신)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi

      # 앱 안 업데이트(휴대폰의 "새 버전이 있어요")가 보는 곳 — 공개 배포 저장소(memoking-releases)의 릴리스 "android" 에
      #   MemoKing-android.apk 와 android-latest.json(버전 · 크기 · SHA-256 · 바뀐 점)을 올린다. PC 설치 파일과 같은 저장소 · 같은 토큰
      #   (Secrets 의 MEMOKING_RELEASES_TOKEN — memoking-releases 하나에만 Contents 쓰기). "prerelease" 라서 PC 의 "최신 릴리스" 링크 · 자동 업데이트를 건드리지 않는다
      #   main 에서 만든 것만 (다른 가지의 시험 빌드가 모두의 업데이트로 나가지 않게), 이미 올라간 것보다 낮은 버전이면 올리지 않는다 (예전 실행을 다시 돌려도 되돌아가지 않게)
      - name: 앱 안 업데이트용으로 공개 배포 저장소에 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.MEMOKING_RELEASES_TOKEN }}
          RELEASES_REPO: lmg6983-dotcom/memoking-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secrets 에 MEMOKING_RELEASES_TOKEN 이 없어 앱 안 업데이트용 파일은 올리지 않았어요 (README 의 '자동 업데이트 배포' 참고)"
            exit 0
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk MemoKing-android.apk
          node scripts/android-update-info.mjs MemoKing-android.apk android-latest.json
          new_code=$(node -p "require('./android-latest.json').versionCode")
          old_code=$(curl -fsSL "https://github.com/${RELEASES_REPO}/releases/download/android/android-latest.json" 2>/dev/null | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{try{console.log(JSON.parse(t).versionCode||0)}catch{console.log(0)}})' || echo 0)
          if [ "${old_code:-0}" -gt "$new_code" ]; then
            echo "::warning::이미 올라간 버전(versionCode ${old_code})이 이번 빌드(${new_code})보다 높아 올리지 않아요"
            exit 0
          fi
          notes="메모킹 안드로이드 앱 안 업데이트용 (versionCode ${new_code}). 휴대폰은 앱이 알아서 확인해요 — 직접 설치하려면 MemoKing-android.apk 를 눌러요."
          if ! gh release view android --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create android --repo "$RELEASES_REPO" --title "메모킹 안드로이드 (최신)" --notes "$notes" --prerelease --latest=false
          fi
          gh release upload android MemoKing-android.apk android-latest.json --repo "$RELEASES_REPO" --clobber
          gh release edit android --repo "$RELEASES_REPO" --notes "$notes" --prerelease --latest=false
          echo "올렸어요: https://github.com/${RELEASES_REPO}/releases/tag/android"
