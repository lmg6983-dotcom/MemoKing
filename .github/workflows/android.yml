# 안드로이드 APK 만들기 — android/ 나 공용 웹 코어(app/)가 바뀌면 자동으로 빌드하고,
# 만든 APK 를 실행 결과(Artifacts)의 "memoking-android" 로 올린다. Actions 탭에서 손으로도 돌릴 수 있다.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # 릴리스에 APK 올리기

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 정확하게 다시 받아쓰기·말한 사람 구분 (sherpa-onnx, Apache-2.0) 안드로이드 라이브러리 받기 (저장소에는 넣지 않음)
      - name: sherpa-onnx 받기
        env:
          GH_TOKEN: ${{ github.token }}
          SHERPA_ONNX_VERSION: v1.13.8
        run: |
          ./scripts/fetch-sherpa-onnx.sh
          unzip -l app/libs/sherpa-onnx.aar | grep -E 'classes.jar|\.so$'

      # 휴대폰이 처음 한 번 받는 모델 주소가 살아 있는지 (실패해도 빌드는 계속 — 앱은 다음 주소로 넘어간다)
      - name: 받아쓰기 모델 주소 확인
        continue-on-error: true
        run: |
          for u in \
            https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/small-encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/small-decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/small-tokens.txt \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 \
            https://huggingface.co/csukuangfj/sherpa-onnx-pyannote-segmentation-3-0/resolve/main/model.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/nemo_en_titanet_small.onnx; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$u"); len=$(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$code ${len:-?} $u"
          done

      - name: 동기화 엔진 테스트 + APK 빌드 (디버그 서명 — 휴대폰에 바로 설치 가능)
        # 저장소 설정 › Secrets 에 넣어 두면 Google Drive 로그인 설정이 APK 에 들어간다 (android/DRIVE-SETUP.md)
        env:
          MEMOKING_GOOGLE_CLIENT_ID: ${{ secrets.MEMOKING_GOOGLE_CLIENT_ID }}
          MEMOKING_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOKING_GOOGLE_CLIENT_SECRET }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: memoking-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 휴대폰에서 바로 받을 수 있게 GitHub 릴리스 "android" 에 늘 최신 APK 를 올린다
      #   https://github.com/<저장소>/releases/download/android/MemoKing-android.apk
      - name: 최신 APK 를 릴리스에 올리기
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MemoKing-android.apk
          notes="메모킹 안드로이드 최신 빌드 (${GITHUB_REF_NAME} · ${GITHUB_SHA::7}). 휴대폰에서 MemoKing-android.apk 를 눌러 설치하세요."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android MemoKing-android.apk --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android MemoKing-android.apk --title "메모킹 안드로이드 (최신)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
