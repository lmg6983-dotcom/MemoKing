# 안드로이드 APK 만들기 — android/ 나 공용 웹 코어(app/)가 바뀌면 자동으로 빌드하고,
# 만든 APK 를 실행 결과(Artifacts)의 "memoking-android" 로 올린다. Actions 탭에서 손으로도 돌릴 수 있다.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드 (디버그 서명 — 휴대폰에 바로 설치 가능)
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: memoking-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
