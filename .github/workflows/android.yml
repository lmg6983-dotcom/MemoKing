# 안드로이드 APK 만들기 — android/ 나 공용 웹 코어(app/)가 바뀌면 자동으로 빌드하고,
# 만든 APK 를 실행 결과(Artifacts)의 "memoking-android" 로 올린다. Actions 탭에서 손으로도 돌릴 수 있다.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # 릴리스에 APK 올리기

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 동기화 엔진 테스트 + APK 빌드 (디버그 서명 — 휴대폰에 바로 설치 가능)
        # 저장소 설정 › Secrets 에 넣어 두면 Google Drive 로그인 설정이 APK 에 들어간다 (android/DRIVE-SETUP.md)
        env:
          MEMOKING_GOOGLE_CLIENT_ID: ${{ secrets.MEMOKING_GOOGLE_CLIENT_ID }}
          MEMOKING_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOKING_GOOGLE_CLIENT_SECRET }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # 빌드 결과물 보관함은 저장 공간 한도가 있어 짧게 두고, 가득 차도 릴리스(다운로드 링크)는 올라가게
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: memoking-android
          retention-days: 3
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 휴대폰에서 바로 받을 수 있게 GitHub 릴리스 "android" 에 늘 최신 APK 를 올린다
      #   https://github.com/<저장소>/releases/download/android/MemoKing-android.apk
      - name: 최신 APK 를 릴리스에 올리기
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MemoKing-android.apk
          notes="메모킹 안드로이드 최신 빌드 (${GITHUB_REF_NAME} · ${GITHUB_SHA::7}). 휴대폰에서 MemoKing-android.apk 를 눌러 설치하세요."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android MemoKing-android.apk --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android MemoKing-android.apk --title "메모킹 안드로이드 (최신)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
