[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "1.8.0"
edition = "2021"
license = "MIT"

# 릴리스 빌드: thin LTO · 나눠 만들기(codegen-units 기본 16) — 통째 LTO(lto = true · codegen-units = 1)는
#   Release (PC) 9분 중 빌드만 7분 반이었다. 설치 파일이 조금 커지는 대신 빌드를 줄인다 (1.4.0)
[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# 잠금 메모의 열쇠 만들기(PBKDF2 31만 번)는 최적화하지 않으면 몇 초씩 걸린다 — 개발 빌드에서도 암호 크레이트는 최적화
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3

# sherpa-rs-sys 빌드 스크립트는 디버그 빌드면 Windows 디버그 CRT(msvcrtd)를 붙인다 — 정적 sherpa-onnx(/MT)와
#   Tauri 의 정적 vcruntime(libcmt)에 섞이지 않게 빌드 스크립트만 디버그 검사를 끈다
[profile.dev.build-override]
debug-assertions = false
