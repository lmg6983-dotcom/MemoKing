[package]
name = "memoking"
description = "메모킹 — 바탕화면에 붙여 쓰는 스티커 메모 (Rust + Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memoking-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# 로그인 때 자동 실행 (Electron setLoginItemSettings 자리, MagicKey 와 같은 플러그인)
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
fancy-regex = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 링크 미리보기 · 인터넷 그림 받기 (Electron net.fetch 자리) — TLS · 인증서 · 프록시는 운영체제 것 (Windows: SChannel)
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip", "win-system-proxy"] }
# 웹페이지 글자 인코딩 (TextDecoder 와 같은 이름표 규칙)
encoding_rs = "0.8"
# 미리보기 그림 파일 이름 = 주소 SHA-1 앞 16자 (Electron 과 같은 이름)
sha1 = "0.10"
# 첨부를 파일 그대로 클립보드에 (clipboard-manager 가 이미 쓰는 것 — 파일 목록은 그 플러그인에 없다)
arboard = { version = "3", default-features = false }
# Google Drive 로그인(PKCE)
getrandom = "0.3"
sha2 = "0.10"
# 알림 보관함: Windows 알림 DB(wpndatabase.db) 복사본 읽기 · 알림 그림 이름 · 크기
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
# 받아쓰기 엔진 (sherpa-onnx, 이 PC 안에서만) — 빌드할 때 sherpa-onnx 미리 빌드한 라이브러리를 받아 붙인다
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

[target.'cfg(windows)'.dependencies]
# 알림 창 (누르면 그 메모를 연다)
tauri-winrt-notification = "0.8"
# Google 로그인 토큰을 Electron safeStorage 와 같게 감싼다 (DPAPI 로 감싼 열쇠 + AES-256-GCM) · AI 엔진을 앱과 함께 끈다 (작업 개체) · 왕관 · 테이프 스티커 창 (sticker_win.rs)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
aes-gcm = "0.10"
# PDF로 저장 (WebView2 PrintToPdf) — Tauri(wry)가 쓰는 판 그대로
webview2-com = "0.39"
# 첨부를 메모 밖으로 끌어내기 (셸 SHDoDragDrop) · PDF 의 COM 형식 · HEVC 디코더가 있는지 (Media Foundation) — webview2-com 이 쓰는 판 그대로 (implement 매크로는 windows_core 이름을 찾는다)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Media_MediaFoundation"] }
windows-core = "0.62"
# 화면 캡처 메모 (Linux 빌드에는 pipewire 가 있어야 해 Windows 만)
xcap = "0.9"
# Windows 는 정적 링크 — 실행 파일 옆에 DLL 을 두지 않아도 되게 (Linux 정적 링크는 RUSTFLAGS 를 바꿔야 해 동적)
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
