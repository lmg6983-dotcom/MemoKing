[package]
name = "memoking-core"
description = "메모킹 메모 폴더 규칙 (메모 파일 · 폴더 · 인덱스 · 알림 · 동기화)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# 머리말 키 순서를 지켜 다시 쓴다 (JS 객체처럼)
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.13"
fancy-regex = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
# 잠금 메모 (memo-lock.js 와 같은 암호: PBKDF2-SHA256 → AES-256-GCM)
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.23"
unicode-normalization = "0.1"
getrandom = "0.3"
# 캘린더 · 링크 미리보기의 주소 읽기 (JS new URL 과 같은 WHATWG 규칙)
url = "2"
# Drive 동기화: 파일이 Drive 것과 같은지 (Drive 가 주는 md5Checksum)
md-5 = "0.10"
